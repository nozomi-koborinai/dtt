name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis
        run: dart analyze

      - name: Verify hermetic catalog generation
        run: |
          dart run tool/generate_catalog.dart
          git diff --exit-code

      - name: Verify generated example manifests and Terraform
        run: |
          dart run packages/dtt/bin/dtt.dart generate --package-dir=examples/firebase_auth_example
          git add --intent-to-add --all
          git diff --exit-code

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Validate generated terraform/main.tf.json
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: Run package unit tests
        run: |
          for pkg in packages/dtt packages/dtt_runtime packages/google_cloud_events; do
            (cd "$pkg" && dart test)
          done

      - name: Run integration tests
        run: (cd _integration_test && dart test)

      - name: Verify zero git drift
        run: git diff --exit-code
